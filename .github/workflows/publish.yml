name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s android/scripts -p 'test_*.py'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Assemble, unit test and lint Android
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Verify debug APK
        run: python3 android/scripts/verify-apk.py android/app/build/outputs/apk/debug/output-metadata.json --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            VERSION="${TAG#v}"
            PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$TAG^" --match 'v*' 2>/dev/null || true)"

            if [ -n "$PREVIOUS_TAG" ]; then
              RANGE="$PREVIOUS_TAG..$TAG"
              CHANGELOG_URL="https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$TAG"
            else
              RANGE="$TAG"
              CHANGELOG_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            fi

            CHANGES="$(
              git log --no-merges --format='• %s' "$RANGE" |
                grep -Eiv '^• ((chore: )?release( ompgui)? v?[0-9]|v?[0-9]+\.[0-9]+\.[0-9]+$)' || true
            )"
            if [ -z "$CHANGES" ]; then
              CHANGES='• Internal release maintenance.'
            fi

            {
              printf '%s\n\n' '## Changes'
              printf '%s\n\n' "$CHANGES"
              printf '%s\n\n' '## Upgrade'
              printf '%s\n' '```bash'
              printf 'npm install -g ompgui@%s\n' "$VERSION"
              printf '%s\n\n' '```'
              printf '**Full changelog:** %s\n' "$CHANGELOG_URL"
            } > release-notes.md

            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.md --draft
          fi

      - name: Download and verify locally signed release APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ANDROID_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          APK="ompgui-remote-${TAG}.apk"
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$APK" --pattern "$APK.sha256" --dir "$RUNNER_TEMP/release-apk" || [ ! -f "$RUNNER_TEMP/release-apk/$APK" ] || [ ! -f "$RUNNER_TEMP/release-apk/$APK.sha256" ]; then
            echo "Release blocked: build/sign $APK locally, upload it and $APK.sha256 to the draft release, then rerun. See docs/release.md. Signing keys must stay local." >&2
            exit 1
          fi
          python3 android/scripts/verify-apk.py "$RUNNER_TEMP/release-apk/$APK" --sha256-file "$RUNNER_TEMP/release-apk/$APK.sha256" --check-history --release --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Publish to npm
        run: |
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "$PACKAGE_NAME@$VERSION" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published"
          else
            npm publish --provenance --access public
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
